<style>

:root[data-theme="dark"]{--bg:#0e1621;--card:#16212f;--ink:#e8edf4;--mute:#9aa7b9;--brand:#8db4ea;--on-brand:#0e1621;--teal:#3cc4be;--tealtint:#143236;--amber:#f0b050;--ambtint:#3a2d17;--tint:#1d2b3e;--line:#2b3a50;--bad:#f0877e;--good:#3cc4be;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px;font-weight:700;color:var(--brand)}h2{font-size:18px;margin:26px 0 10px}h3{font-size:17px;margin:6px 0 8px}h4{margin:14px 0 4px}
p{margin:0 0 10px}.mute{color:var(--mute);font-size:14px}.hide{display:none}
a{color:var(--brand)}.back{display:inline-block;margin-bottom:6px;font-weight:500;text-decoration:none}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.cards{display:grid;gap:10px;margin:16px 0}
.chap{display:flex;gap:14px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink)}

.num{flex:0 0 42px;height:42px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px}

.tabs button[aria-selected="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.chip{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 10px}
.note{background:var(--tealtint);border-left:4px solid var(--teal);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}.note.amber{background:var(--ambtint);border-left-color:var(--amber)}.note p{margin:4px 0 0}
ol{padding-left:22px;margin:6px 0}li{margin:4px 0}
.flow,.steps{list-style:none;padding:0;margin:8px 0}.flow li,.steps li{background:var(--tint);border-radius:10px;padding:8px 12px;margin:0 0 10px;position:relative;font-size:15px}
.flow li:not(:last-child)::after{content:"";position:absolute;left:20px;bottom:-10px;width:2px;height:10px;background:var(--teal)}
.flow li.last,.steps li.last{background:var(--tealtint);font-weight:700;color:var(--good)}
.viz{width:100%;height:auto;max-width:420px;display:block;margin:8px auto 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}th{background:var(--brand);color:var(--on-brand)}
details{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 14px;margin:8px 0}summary{cursor:pointer;font-weight:700;padding:10px 0}

.fb{flex:1 0 100%;font-size:14px;font-weight:500;padding-left:34px}.fb.good,.good{color:var(--good)}.fb.bad,.bad{color:var(--bad)}
.link{background:none;border:0;color:var(--brand);font:500 14px Poppins,system-ui,sans-serif;cursor:pointer}
.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--brand);color:var(--on-brand);font:700 16px Poppins,system-ui,sans-serif;cursor:pointer}

.qcard input{width:100%;font:700 28px Poppins,system-ui,sans-serif;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.clk{font-size:24px;font-variant-numeric:tabular-nums;color:var(--teal)}
.big{font-size:52px;font-weight:700;color:var(--brand);line-height:1.1}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
</style>
</head>

ltiple of 10. The distance to it is d.", "Move one copy of the number down by d and the other copy up by d.", "Multiply the two new numbers.", "Add d × d, which returns what you borrowed."], "why": "Moving the numbers apart by equal amounts makes the product smaller by exactly d × d, so adding d × d back gives the square exactly.", "mistake": "Forgetting to add the gap squared. The product 44 × 50 alone is 2,200, which is 9 short of 47 × 47.", "examples": [{"prob": "47 × 47", "lines": ["Nearest ten is 50, distance 3", "47 - 3 = 44 and 47 + 3 = 50", "44 × 50 = 2,200", "3 × 3 = 9", "2,200 + 9 = 2,209"]}, {"prob": "38 × 38", "lines": ["Nearest ten is 40, distance 2", "38 - 2 = 36 and 38 + 2 = 40", "36 × 40 = 1,440", "2 × 2 = 4", "1,440 + 4 = 1,444"]}, {"prob": "63 × 63", "lines": ["Nearest ten is 60, distance 3", "63 - 3 = 60 and 63 + 3 = 66", "60 × 66 = 3,960", "3 × 3 = 9", "3,960 + 9 = 3,969"]}], "tryit": [{"q": "37 squared =", "a": 1369, "t": "1,369"}, {"q": "48 squared =", "a": 2304, "t": "2,304"}, {"q": "53 squared =", "a": 2809, "t": "2,809"}, {"q": "62 squared =", "a": 3844, "t": "3,844"}, {"q": "79 squared =", "a": 6241, "t": "6,241"}, {"q": "88 squared =", "a": 7744, "t": "7,744"}]}, {"name": "Tens and Ones", "when": "Squaring numbers whose digits are easy to split, such as 23, 34 or 41.", "steps": ["Split the number into tens and ones.", "Square the tens.", "Multiply the tens by the ones, then double it.", "Square the ones.", "Add the three results."], "why": "A number is its tens plus its ones, and squaring splits into three parts: the tens squared, twice the tens times the ones, and the ones squared. Each part is easy on its own.", "mistake": "Forgetting to double the middle part. The middle term is 2 × tens × ones, not tens × ones.", "examples": [{"prob": "23 × 23", "lines": ["20 × 20 = 400", "2 × 20 × 3 = 120", "3 × 3 = 9", "400 + 120 + 9 = 529"]}, {"prob": "34 × 34", "lines": ["30 × 30 = 900", "2 × 30 × 4 = 240", "4 × 4 = 16", "900 + 240 + 16 = 1,156"]}, {"prob": "41 × 41", "lines": ["40 × 40 = 1,600", "2 × 40 × 1 = 80", "1 × 1 = 1", "1,600 + 80 + 1 = 1,681"]}], "tryit": [{"q": "23 squared =", "a": 529, "t": "529"}, {"q": "34 squared =", "a": 1156, "t": "1,156"}, {"q": "41 squared =", "a": 1681, "t": "1,681"}, {"q": "56 squared =", "a": 3136, "t": "3,136"}, {"q": "67 squared =", "a": 4489, "t": "4,489"}, {"q": "74 squared =", "a": 5476, "t": "5,476"}], "vis": {"type": "area", "items": [{"rows": [20, 3], "cols": [20, 3]}, {"rows": [30, 4], "cols": [30, 4]}, {"rows": [40, 1], "cols": [40, 1]}]}}, {"name": "Cubes", "when": "Cubing a number up to about 15.", "steps": ["Square the number with a method from this chapter.", "Multiply the square by the number, using Break Apart from Chapter 2."], "why": "A cube is a square times one more copy of the number. You already know how to square, so only one new multiplication is left.", "mistake": "Confusing a cube with multiplying by 3. 12 cubed is 1,728, not 36.", "examples": [{"prob": "12 × 12 × 12", "lines": ["12 × 12 = 144", "144 × 10 = 1,440", "144 × 2 = 288", "1,440 + 288 = 1,728"]}, {"prob": "13 × 13 × 13", "lines": ["13 × 13 = 169", "169 × 10 = 1,690", "169 × 3 = 507", "1,690 + 507 = 2,197"]}, {"prob": "15 × 15 × 15", "lines": ["15 × 15 = 225", "225 × 10 = 2,250", "225 × 5 = 1,125", "2,250 + 1,125 = 3,375"]}], "tryit": [{"q": "4 cubed =", "a": 64, "t": "64"}, {"q": "7 cubed =", "a": 343, "t": "343"}, {"q": "9 cubed =", "a": 729, "t": "729"}, {"q": "11 cubed =", "a": 1331, "t": "1,331"}, {"q": "13 cubed =", "a": 2197, "t": "2,197"}, {"q": "14 cubed =", "a": 2744, "t": "2,744"}]}, {"name": "Powers of 2 and 10", "when": "You need a power of 2, or a product of powers with the same base.", "steps": ["Learn 2^1 to 2^5 by heart: 2, 4, 8, 16, 32.", "Split a bigger power into two smaller ones: 2^9 is 2^5 × 2^4.", "Multiply the two answers.", "For powers of 10, add the exponents: 10^3 × 10^4 is 10^7."], "why": "2^6 means six 2s multiplied together. Splitting the exponent splits the multiplication into two smaller, friendlier ones.", "mistake": "Adding the answers instead of multiplying them. 2^3 × 2^3 is 8 × 8 = 64, not 8 + 8 = 16.", "examples": [{"prob": "2^6", "lines": ["2^6 is 2^3 × 2^3", "2^3 is 8", "8 × 8 = 64"]}, {"prob": "2^9", "lines": ["2^9 is 2^5 × 2^4", "2^5 is 32 and 2^4 is 16", "32 × 16 = 512"]}, {"prob": "2^10", "lines": ["2^10 is 2^5 × 2^5", "2^5 is 32", "32 × 32 = 1,024"]}], "tryit": [{"q": "2^5 =", "a": 32, "t": "32"}, {"q": "2^8 =", "a": 256, "t": "256"}, {"q": "2^9 =", "a": 512, "t": "512"}, {"q": "2^10 =", "a": 1024, "t": "1,024"}, {"q": "2^11 =", "a": 2048, "t": "2,048"}, {"q": "2^12 =", "a": 4096, "t": "4,096"}]}, {"name": "Square Roots", "when": "Finding the square root of a perfect square up to about 3,600.", "steps": ["Find the two tens whose squares surround the number. This gives the tens digit.", "Use the last digit to find the ones digit. A last digit of 1 comes from 1 or 9, 4 from 2 or 8, 5 from 5, 6 from 4 or 6, 9 from 3 or 7, and 0 from 0.", "If there are two choices, square the number ending in 5 between them. If your number is smaller, take the smaller choice. If it is larger, take the larger one."], "why": "The squares of the tens fence the answer in, and the last digit of a square leaves only two choices for the ones digit. The square of the number ending in 5 between them settles which one it is.", "mistake": "Skipping the check. Always multiply your answer by itself once to confirm it.", "examples": [{"prob": "Root of 529", "lines": ["20 × 20 = 400 and 30 × 30 = 900, so the tens digit is 2", "Last digit 9: the ones digit is 3 or 7", "25 × 25 = 625, which is more than 529", "So take the smaller choice: 23", "Check: 23 × 23 = 529"]}, {"prob": "Root of 1,296", "lines": ["30 × 30 = 900 and 40 × 40 = 1,600, so the tens digit is 3", "Last digit 6: the ones digit is 4 or 6", "35 × 35 = 1,225, which is less than 1,296", "So take the larger choice: 36", "Check: 36 × 36 = 1,296"]}, {"prob": "Root of 3,481", "lines function chapterView(c){$("#app").innerHTML=`<a class="back" href="#">All chapters</a><p class="mute">Chapter ${c.num}</p><h1>${esc(c.title)}</h1><div class="tabs" role="tablist">`+TABS.map(([k,l])=>`<button role="tab" aria-selected="${st.tab===k}" data-t="${k}">${l}</button>`).join("")+`</div><div id="pane"></div>`;
 document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;st.run=null;clearInterval(st.tick);chapterView(c)});

function learn(c,p){p.innerHTML=`<div class="note"><b>Chapter goal</b><p>${esc(c.goal)}</p></div><p>${esc(c.intro)}</p>`+(c.warm.length?`<h2>Warm-up</h2>`+c.warm.map(w=>`<div class="note"><b>${esc(w.t)}</b><p>${esc(w.x)}</p></div>`).join(""):"")+`<h2>The ${c.tricks.length} techniques</h2>`+c.tricks.map((t,i)=>`<div class="card"><span class="chip">Technique ${i+1}</span><h3>${esc(t.name)}</h3><p><b>Use it when:</b> ${esc(t.when)}</p><p class="mute">${esc(t.why)}</p></div>`).join("")+`<div class="note"><b>Remember</b><p>${c.summary.map((s,i)=>esc(s)).join(" ")}</p></div>`}
const flow=L=>`<ol class="flow">`+L.map((l,i)=>`<li class="${i===L.length-1?"last":""}">${esc(l)}</li>`).join("")+`</ol>`;
function numline(p){const n=p.length,W=320,x=i=>24+i*(W-48)/(n-1);let s=`<svg viewBox="0 0 ${W} 92" class="viz" role="img" aria-label="Number line with jumps"><line x1="14" y1="58" x2="${W-14}" y2="58" style="stroke:var(--line)" stroke-width="3"/>`;
 p.forEach((v,i)=>{s+=`<circle cx="${x(i)}" cy="58" r="5" style="fill:var(--brand)"/><text x="${x(i)}" y="80" text-anchor="middle" font-size="12" style="fill:var(--ink)">${v}</text>`;if(i<n-1){const m=(x(i)+x(i+1))/2;s+=`<path d="M${x(i)} 52 Q${m} 6 ${x(i+1)} 52" fill="none" style="stroke:var(--teal)" stroke-width="2"/><text x="${m}" y="22" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--teal)">+${p[i+1]-v}</text>`}});

function area(it){const W=300,H=130,L=44,T=28,fit=(a,tot,m)=>{const s=a.reduce((x,y)=>x+y,0);let w=a.map(v=>Math.max(m,v/s*tot));const k=tot/w.reduce((x,y)=>x+y,0);return w.map(x=>x*k)};

 rh.forEach((h,r)=>{let x=L;cw.forEach((w,c)=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:var(${(r+c)%2?"--tint":"--tealtint"});stroke:var(--line)"/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="14" font-weight="700" style="fill:var(--ink)">${it.rows[r]*it.cols[c]}</text>`;if(r===0)s+=`<text x="${x+w/2}" y="18" text-anchor="middle" font-size="12" style="fill:var(--mute)">${it.cols[c]}</text>`;x+=w});s+=`<text x="${L-8}" y="${y+h/2+4}" text-anchor="end" font-size="12" style="fill:var(--mute)">${it.rows[r]}</text>`;y+=h});

function visual(c,p){p.innerHTML=`<p class="mute">Each picture shows one worked example from the book.</p>`+c.tricks.map((t,i)=>`<h2>${i+1}. ${esc(t.name)}</h2>`+t.examples.map((e,j)=>`<div class="card"><b>${esc(e.prob)}</b>`+(t.vis?(t.vis.type==="line"?numline(t.vis.items[j]):area(t.vis.items[j])):flow(e.lines))+`</div>`).join("")).join("")}
function tech(c,p){p.innerHTML=c.tricks.map((t,i)=>`<div class="card"><span class="chip">Technique ${i+1}</span><h3>${esc(t.name)}</h3><p><b>Use it when:</b> ${esc(t.when)}</p><ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="note amber"><b>Common mistake</b><p>${esc(t.mistake)}</p></div></div>`).join("")+`<h2>Quick reference</h2><div class="scroll"><table>${c.cheat.map((r,i)=>`<tr>${r.map(x=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join("")}</tr>`).join("")}</table></div>`}
function ex(c,p){p.innerHTML=`<p class="mute">Tap to reveal one step at a time. Try to guess the next step first.</p>`+c.tricks.map((t,i)=>`<h2>${i+1}. ${esc(t.name)}</h2>`+t.examples.map(e=>`<div class="card ex" data-l="${esc(JSON.stringify(e.lines))}"><b>${esc(e.prob)}</b><ol class="steps"></ol><button class="small nx">Show first step</button> <button class="link rs hide">Reset</button></div>`).join("")).join("");

const qrows=a=>a.map((q,i)=>`<div class="qr" data-a="${esc(q.a)}" data-yn="${q.yn?1:0}"><span class="qn">${i+1}</span><span class="qt">${esc(q.q)}</span>${q.yn?(q.opts||["OK","WRONG"]).map(o=>`<button class="small yn" data-v="${o}">${o}</button>`).join(""):`<input inputmode="decimal" autocomplete="off" aria-label="Answer ${i+1}"><button class="small chk">Check</button>`}<span class="fb"></span></div>`).join("");

 const fin=()=>finish(c,"timed","Timed test",c.timed.map((q,i)=>({q:q.q,ok:r.ans[i]!==undefined&&Math.abs(Number(r.ans[i])-q.a)<1e-9,you:r.ans[i]===undefined?"not reached":r.ans[i],right:q.t})),Math.min((Date.now()-r.t0)/1000,T));
 const sub=()=>{const v=$("#ti").value.replace(/[,\s]/g,"");if(v==="")return;r.ans.push(v);r.i++;r.i>=c.timed.length?fin():show()};
 $("#tn").onclick=sub;$("#ti").addEventListener("keydown",e=>{if(e.key==="Enter")sub()});show();
 clearInterval(st.tick);st.tick=setInterval(()=>{const rem=T-(Date.now()-r.t0)/1000,s=Math.max(0,Math.ceil(rem));$("#clk").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(rem<=0)fin()},200)}
function res(c,p){const it=["mcq","timed"].map(k=>st.last[c.id+k]).filter(Boolean);if(!it.length){p.innerHTML=`<div class="card"><h3>No result yet</h3><p>Take the MCQ test or the timed test. Your score and the correct answers will appear here instantly.</p></div>`;return}
 p.innerHTML=it.map(r=>{const pct=Math.round(100*r.s/r.n),lv=pct>=90?"Excellent":pct>=75?"Strong":pct>=50?"Keep practising":"Review the techniques first";return`<div class="card"><h3>${r.title}</h3><div class="big" data-score>${r.s}/${r.n}</div><p><b>${lv}</b>, ${pct}% accuracy${r.el?", "+Math.round(r.el)+" seconds":""}</p><h4>Review</h4>`+r.rows.map(x=>`<div class="row"><span>${esc(x.q)}</span><span class="${x.ok?"good":"bad"}">${x.ok?"Correct "+esc(x.right):"You: "+esc(x.you)+", answer: "+esc(x.right)}</span></div>`).join("")+`</div>`}).join("")}
render();
</script>
</body></html>
